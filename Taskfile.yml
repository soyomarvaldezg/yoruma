version: '3'

vars:
  TOOLS: tools

tasks:

  default:
    desc: List the available tasks
    silent: true
    cmds:
      - task --list

  deps:
    desc: Install the dev-only verifier — Node deps plus a Chromium for Playwright
    dir: '{{.TOOLS}}'
    cmds:
      - npm install
      - npx playwright install chromium

  check:
    desc: Run the in-page suite headless; fails on any red line
    cmds:
      - node {{.TOOLS}}/verify.mjs

  shots:
    desc: Regenerate the README screenshots into docs/
    cmds:
      - node {{.TOOLS}}/shots.mjs

  measure:
    desc: Measure full-render cost at 50, 100, 200 and 400 shapes
    cmds:
      - node {{.TOOLS}}/measure.mjs

  icons:
    desc: Regenerate the bundled monochrome icon pack (js/84-icons.js) from simple-icons
    cmds:
      - node {{.TOOLS}}/icons.mjs

  blocks:
    desc: Regenerate the Blocks palette as text (docs/example-blocks.yaml) from the catalog
    cmds:
      - node {{.TOOLS}}/blocks-text.mjs

  shot-d2:
    desc: Screenshot docs/pipeline-from-d2.yaml into docs/pipeline-from-d2.png
    cmds:
      - node {{.TOOLS}}/shot-d2.mjs
